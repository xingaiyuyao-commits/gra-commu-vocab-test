<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ÖSH Vocabulary Challenge</title>
<style>
  :root { --paper:#fff; --ink:#202020; --muted:#7b7b7b; --line:#dededb; --gold:#c99820; }
  * { box-sizing: border-box; }
  html { background: var(--paper); }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:Arial,"Helvetica Neue","Hiragino Sans","Yu Gothic UI","Yu Gothic",sans-serif; -webkit-font-smoothing:antialiased; }
  a { color:inherit; }
  .page { width:min(100%,1120px); margin:0 auto; padding:48px 28px 80px; }
  h1 { margin:0 0 42px; max-width:980px; font-size:clamp(4rem,12vw,8.15rem); font-weight:800; letter-spacing:-.075em; line-height:.86; }
  .join-cta { display:flex; align-items:center; justify-content:center; gap:30px; min-height:112px; padding:24px; background:var(--ink); color:#fff; font-size:clamp(1.2rem,3vw,2rem); font-weight:700; text-align:center; text-decoration:none; }
  .join-cta .arrow { color:#d59b12; font-size:1.5em; font-weight:400; }
  .join-cta:focus-visible,.course-link:focus-visible { outline:3px solid var(--gold); outline-offset:4px; }
  .today-card { display:flex; align-items:center; justify-content:space-between; min-height:126px; margin:42px 30px 62px; padding:23px 29px; border:2px solid var(--line); }
  .today-card[hidden] { display:none; }
  .today-label { margin:0 0 14px; color:var(--muted); font-size:1.35rem; font-weight:600; letter-spacing:.04em; }
  .today-date { margin:0; font-size:1.55rem; }
  .today-day { margin:0; font-size:2.75rem; font-weight:800; white-space:nowrap; }
  .home-illustration { margin:0 0 54px; }
  .home-illustration img { display:block; width:100%; height:auto; }
  .course-heading { margin:0 0 30px; color:var(--muted); font-size:1.45rem; font-weight:600; letter-spacing:.18em; }
  .course-list { border-top:2px solid var(--ink); }
  .course-link { display:grid; grid-template-columns:80px 1fr auto; align-items:center; gap:28px; min-height:110px; border-bottom:1px solid var(--line); text-decoration:none; }
  .course-number { color:var(--gold); font-size:1.7rem; font-weight:800; letter-spacing:.08em; }
  .course-name { font-size:2.55rem; font-weight:800; letter-spacing:-.035em; }
  .course-arrow { font-size:2rem; }
  @media (hover:hover) {
    .join-cta:hover { background:#303030; }
    .course-link:hover .course-name { text-decoration:underline; text-underline-offset:7px; }
  }
  @media (max-width:640px) {
    .page { padding:30px 16px 56px; }
    h1 { margin-bottom:28px; font-size:clamp(3rem,16vw,5.2rem); }
    .join-cta { min-height:82px; gap:16px; padding:18px 12px; font-size:1.05rem; }
    .today-card { min-height:96px; margin:28px 0 36px; padding:17px 18px; }
    .today-label { margin-bottom:8px; font-size:.95rem; }
    .today-date { font-size:1.1rem; }
    .today-day { font-size:1.75rem; }
    .home-illustration { margin-bottom:36px; }
    .course-heading { margin-bottom:20px; font-size:1rem; }
    .course-link { grid-template-columns:48px 1fr auto; gap:10px; min-height:82px; }
    .course-number { font-size:1.15rem; }
    .course-name { font-size:1.8rem; }
    .course-arrow { font-size:1.4rem; }
  }
</style>
</head>
<body>
<main class="page">
  <h1>ÖSH Vocabulary<br />Challenge</h1>
  <a class="join-cta" href="/quiz.html?mode=join">
    <span>ルームコードを入力して参加する</span><span class="arrow" aria-hidden="true">→</span>
  </a>
  <section class="today-card" id="today-card" aria-labelledby="today-heading" hidden>
    <div><h2 class="today-label" id="today-heading">今日の学習</h2><p class="today-date" id="today-date"></p></div>
    <p class="today-day" id="today-day"></p>
  </section>
  <figure class="home-illustration">
    <img src="/assets/osh-vocab-home-illustration.png" alt="Clacel・TOEIC・IELTSの単語学習チャレンジ" width="898" height="518" />
  </figure>
  <section aria-labelledby="course-heading">
    <h2 class="course-heading" id="course-heading">CHOOSE YOUR COURSE</h2>
    <nav class="course-list" aria-label="コースを選択">
      <a class="course-link" href="/quiz.html?mode=create"><span class="course-number">01</span><span class="course-name">Clacel</span><span class="course-arrow" aria-hidden="true">→</span></a>
      <a class="course-link" href="/quiz.html?mode=create"><span class="course-number">02</span><span class="course-name">TOEIC</span><span class="course-arrow" aria-hidden="true">→</span></a>
      <a class="course-link" href="/quiz.html?mode=create"><span class="course-number">03</span><span class="course-name">IELTS</span><span class="course-arrow" aria-hidden="true">→</span></a>
    </nav>
  </section>
</main>
<script src="/ui-logic.js"></script>
<script>
  const studyDay = QuizUi.getStudyDay(new Date());
  if (studyDay !== null) {
    const today = new Date();
    document.getElementById("today-date").textContent = `${today.getMonth() + 1}月${today.getDate()}日`;
    document.getElementById("today-day").textContent = `Day ${studyDay}`;
    document.getElementById("today-card").hidden = false;
  }
</script>
</body>
</html>
