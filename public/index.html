<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>英単語チャレンジ — みんなで続ける英単語テスト</title>
<style>
  :root {
    --background: #f7f8fc;
    --foreground: #182033;
    --card: #fff;
    --primary: #3154c8;
    --primary-dark: #2544ad;
    --primary-soft: #edf1ff;
    --muted: #667085;
    --border: #dfe3ed;
    --warm: #f4a936;
    --radius: 16px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Hiragino Sans", "Yu Gothic UI", "Yu Gothic", sans-serif;
    background:
      radial-gradient(circle at 18% 8%, rgb(49 84 200 / .08), transparent 30rem),
      var(--background);
    color: var(--foreground);
    min-height: 100vh;
    padding: 48px 20px;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { width: 100%; max-width: 720px; margin: 0 auto; }
  .hero { margin-bottom: 28px; }
  .eyebrow {
    color: var(--primary); font-size: .76rem; font-weight: 800;
    letter-spacing: .13em; text-transform: uppercase; margin-bottom: 10px;
  }
  h1 { font-size: clamp(2rem, 7vw, 3rem); line-height: 1.14; letter-spacing: -.04em; margin-bottom: 12px; }
  .lead { max-width: 34rem; color: var(--muted); font-size: .96rem; line-height: 1.75; }
  .today-card {
    display: flex; align-items: center; justify-content: space-between; gap: 20px;
    margin: 24px 0 18px; padding: 16px 20px;
    background: var(--foreground); color: white; border-radius: var(--radius);
    box-shadow: 0 12px 30px rgb(24 32 51 / .12);
  }
  .today-card[hidden] { display: none; }
  .today-label { color: #cbd4f5; font-size: .78rem; font-weight: 700; margin-bottom: 3px; }
  .today-date { font-size: .92rem; }
  .today-day { font-size: 1.7rem; font-weight: 800; letter-spacing: -.03em; white-space: nowrap; }
  .section-title { font-size: .82rem; color: var(--muted); letter-spacing: .08em; margin: 26px 0 10px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: 0 8px 30px rgb(24 32 51 / .06); padding: 26px;
  }
  .game-heading { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  .game-icon { display: grid; place-items: center; width: 44px; height: 44px; background: var(--primary-soft); border-radius: 12px; font-size: 1.45rem; }
  h2 { font-size: 1.22rem; letter-spacing: -.02em; }
  .desc { color: var(--muted); font-size: .9rem; line-height: 1.7; margin-bottom: 20px; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn {
    display: flex; align-items: center; justify-content: center; min-height: 44px;
    border-radius: 10px; font-size: .9rem; font-weight: 700; text-decoration: none;
    background: var(--primary); color: white; border: 1px solid var(--primary);
    transition: background .15s, transform .15s, box-shadow .15s;
  }
  .btn:hover { background: var(--primary-dark); box-shadow: 0 5px 14px rgb(49 84 200 / .2); transform: translateY(-1px); }
  .btn:focus-visible { outline: 3px solid var(--warm); outline-offset: 3px; }
  .btn.secondary { background: white; color: var(--foreground); border-color: var(--border); }
  .btn.secondary:hover { background: #f7f8fc; box-shadow: none; }
  .coming-soon {
    background: rgb(255 255 255 / .65); border: 1px dashed #c8cedc; border-radius: var(--radius);
    padding: 20px 22px;
  }
  .coming-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .badge { color: #8a4b05; background: #fff3d7; border-radius: 999px; padding: 4px 9px; font-size: .7rem; font-weight: 800; }
  .future-list { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; }
  .future-list li { background: white; border: 1px solid var(--border); border-radius: 999px; padding: 7px 11px; color: #596174; font-size: .8rem; }
  @media (max-width: 520px) {
    body { padding: 32px 16px; }
    .card { padding: 22px 20px; }
    .actions { grid-template-columns: 1fr; }
    .today-card { padding: 15px 17px; }
  }
</style>
</head>
<body>
<main class="wrap">
  <header class="hero">
    <p class="eyebrow">OSH Vocabulary Challenge</p>
    <h1>英単語チャレンジ</h1>
    <p class="lead">仲間と同じDayに挑戦する、20問・5分の英単語テストです。ルームを作るか、共有されたコードで参加してください。</p>
  </header>

  <section class="today-card" id="today-card" aria-labelledby="today-heading" hidden>
    <div>
      <h2 class="today-label" id="today-heading">今日の学習</h2>
      <p class="today-date" id="today-date"></p>
    </div>
    <p class="today-day" id="today-day"></p>
  </section>

  <section aria-labelledby="available-heading">
    <h2 class="section-title" id="available-heading">今すぐ遊べるゲーム</h2>
    <article class="card">
      <div class="game-heading">
        <span class="game-icon" aria-hidden="true">📚</span>
        <h2>単語テスト</h2>
      </div>
      <p class="desc">Clacel・IELTS・TOEICから単語帳とDayを選択。全員で20問に挑戦します。</p>
      <div class="actions">
        <a class="btn" href="/quiz.html?mode=join">コードで参加</a>
        <a class="btn secondary" href="/quiz.html?mode=create">ルームを作成</a>
      </div>
    </article>
  </section>

  <section aria-labelledby="coming-heading">
    <h2 class="section-title" id="coming-heading">近日公開</h2>
    <div class="coming-soon">
      <div class="coming-head">
        <span class="badge">COMING SOON</span>
        <p>新しい遊び方を準備中です</p>
      </div>
      <ul class="future-list" aria-label="開発中のゲーム">
        <li>🪙 コインタワー</li>
        <li>🧩 並べ替えバトル</li>
        <li>🔥 Survive</li>
      </ul>
    </div>
  </section>
</main>
<script src="/ui-logic.js"></script>
<script>
  const studyDay = QuizUi.getStudyDay(new Date());
  if (studyDay !== null) {
    const today = new Date();
    document.getElementById("today-date").textContent = `${today.getMonth() + 1}月${today.getDate()}日`;
    document.getElementById("today-day").textContent = `Day ${studyDay}`;
    document.getElementById("today-card").hidden = false;
  }
</script>
</body>
</html>
